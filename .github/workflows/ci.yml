name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build, test, and TestFlight distribution are handled by Xcode Cloud.
# This workflow runs only fast lint checks for quick PR feedback (< 2 min).

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: SwiftFormat lint
        run: swiftformat LiShu LiShuTests LiShuUITests --lint --config .swiftformat

      - name: SwiftLint
        run: swiftlint lint --strict
