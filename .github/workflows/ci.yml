name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios-ci:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install swiftlint swiftformat xcbeautify

      - name: SwiftFormat lint
        run: swiftformat LiShu LiShuTests LiShuUITests --lint --config .swiftformat

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: Unit tests
        run: |
          xcodebuild test \
            -project LiShu.xcodeproj \
            -scheme LiShu \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -parallel-testing-enabled NO \
            -skip-testing:LiShuUITests \
            | xcbeautify --quiet
