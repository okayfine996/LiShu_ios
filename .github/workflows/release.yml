name: Release to App Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit for review after upload'
        type: boolean
        default: true

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: SwiftLint
        run: brew install swiftlint && swiftlint lint --strict

      - name: Release to App Store
        env:
          DIST_CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: "1"
          CI: "true"
        run: |
          SUBMIT="${{ github.event.inputs.submit_for_review || 'true' }}"
          bundle exec fastlane ios release_store submit:$SUBMIT
