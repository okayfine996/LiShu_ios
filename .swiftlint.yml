# LiShu — baseline SwiftLint: start with minimal rules; expand later via only_rules → opt_in_rules.
included:
  - LiShu
  - LiShuTests
  - LiShuUITests

excluded:
  - .build
  - DerivedData

only_rules:
  - line_length
  - force_unwrapping
  - unused_import
  - empty_count
  - prefer_self_type_over_type_of_self
  - redundant_type_annotation

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

force_unwrapping:
  severity: warning
